<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pedido.css">
</head>
<body>
  <header class="topo">
    <h1>Pedidos</h1>
    <span id="quem"></span>
    <button class="botao escondido" id="btnSair">Sair</button>
  </header>

  <div class="login-box" id="telaLogin">
    <h2>Entrar</h2>
    <label>E-mail</label>
    <input type="email" id="email">
    <label>Senha</label>
    <input type="password" id="senha">
    <button class="botao" id="btnEntrar">Entrar</button>
    <p class="msg-pedido" id="msgLogin"></p>
  </div>

  <div id="telaPedidos" class="escondido">
    <div class="ped-filtros" id="filtros"></div>
    <div class="ped-lista" id="lista"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="pedido.js"></script>
</body>
</html>
