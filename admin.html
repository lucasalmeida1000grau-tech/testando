<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Dono</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topo">
    <h1>🍦 Painel do Dono</h1>
    <button class="botao escondido" id="btnSair">Sair</button>
  </header>

  <div class="caixa" id="telaLogin">
    <h2>Entrar</h2>
    <label>E-mail</label>
    <input type="email" id="email">
    <label>Senha</label>
    <input type="password" id="senha">
    <button class="botao" id="btnEntrar">Entrar</button>
    <p class="msg" id="msgLogin"></p>
  </div>

  <div id="telaPainel" class="escondido">
    <div class="caixa">
      <h2 id="tituloForm">Novo sabor</h2>
      <input type="hidden" id="idSabor">
      <label>Nome</label>
      <input type="text" id="nome">
      <label>Descrição</label>
      <textarea id="descricao" rows="2"></textarea>
      <div class="linha">
        <div><label>Preço (R$)</label><input type="number" step="0.01" id="preco"></div>
        <div><label>Custo (R$)</label><input type="number" step="0.01" id="custo"></div>
      </div>
      <label>Categoria</label>
      <input type="text" id="categoria" value="Sorvete">
      <label>Foto</label>
      <input type="file" id="foto" accept="image/*">
      <label><input type="checkbox" id="destaque"> Destaque</label><br>
      <label><input type="checkbox" id="disponivel" checked> Disponível</label>
      <br><br>
      <button class="botao" id="btnSalvar">Salvar</button>
      <button class="botao cinza escondido" id="btnCancelar">Cancelar edição</button>
      <p class="msg" id="msgForm"></p>
    </div>

    <div class="caixa">
      <h2>Sabores cadastrados</h2>
      <div id="listaAdmin"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
    <script src="painel.js"></script>
</body>
</html>
