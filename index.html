<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorveteria</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="carrinho.css">
</head>
<body>
  <header class="topo">
    <h1>🍦 Nome da Sorveteria</h1>
    <button class="btn-carrinho" id="btnAbrir">🛒 Carrinho <span id="contador">0</span></button>
  </header>

  <section class="secao">
    <h2>Nossos Sabores</h2>
    <div id="lista" class="cards">
      <p class="aviso">Carregando sabores...</p>
    </div>
  </section>

  <div class="fundo escondido" id="painelCarrinho">
    <div class="painel">
      <button class="fechar" id="btnFechar">×</button>
      <h2>Seu carrinho</h2>
      <div id="itensCarrinho"></div>
      <div class="total">Total: <span id="totalCarrinho">R$ 0,00</span></div>

      <label>Seu nome</label>
      <input type="text" id="cNome">
      <label>Telefone (WhatsApp)</label>
      <input type="tel" id="cTelefone">
      <label>Forma de pagamento (na retirada)</label>
      <select id="cPagamento">
        <option value="pix">Pix</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="credito">Cartão de crédito</option>
        <option value="debito">Cartão de débito</option>
      </select>

      <button class="botao" id="btnFinalizar">Finalizar pedido</button>
      <p class="msg-pedido" id="msgPedido"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="carrinho.js"></script>
  <script src="app.js"></script>
</body>
</html>
